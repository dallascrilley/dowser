# CI Auto-Fix
# Automatically attempts to fix CI failures

name: Auto Fix CI Failures

on:
  workflow_run:
    workflows: ["CI"]  # Replace with your CI workflow name
    types: [completed]

jobs:
  auto-fix:
    # Only run on failures, prevent infinite loops
    if: |
      github.event.workflow_run.conclusion == 'failure' &&
      !startsWith(github.event.workflow_run.head_branch, 'claude-auto-fix-ci-')

    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      actions: read  # Essential for reading CI logs
      id-token: write

    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

    steps:
      - name: Checkout failing branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}

      - name: Fix CI failures with Claude
        uses: anthropics/claude-code-action@v1
        with:
          additional_permissions: |
            actions: read

          prompt: |
            CI workflow failed on branch `${{ github.event.workflow_run.head_branch }}`.

            MISSION:
            1. Use mcp__github_ci__download_job_log to get logs from run ${{ github.event.workflow_run.id }}
            2. Analyze the failure
            3. Fix the relevant files
            4. Commit changes with message "fix(ci): Attempt to fix CI failure"

          claude_args: |
            --allowedTools "mcp__github_ci__download_job_log,Read,Write,Edit,Bash(git:*),Bash(npm install),Bash(npm test)"
            --max-turns 25
