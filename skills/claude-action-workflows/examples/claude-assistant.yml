# Interactive Claude Assistant
# Responds to @claude mentions in comments

name: Claude Assistant

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    # Only trigger on @claude mentions
    if: contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write  # Required for OAuth OIDC

    env:
      # Recommended: Uses Claude Pro/Max subscription
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

    steps:
      - uses: actions/checkout@v5

      - uses: anthropics/claude-code-action@v1
        with:
          # Optional: Customize behavior
          claude_args: |
            --max-turns 10
            --system-prompt "Follow our TypeScript coding standards and best practices"
